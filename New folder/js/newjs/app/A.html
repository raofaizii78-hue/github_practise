<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Management CRUD</title>
    <link rel="stylesheet" href="B.css">
</head>

<body>

    <div class="container">

        <h2>Data Management System</h2>

        <div class="input-group">
            <input type="text" id="dataInput" placeholder="Enter your data..." autofocus>
        </div>

        <div class="button-group">
            <button id="enterBtn" onclick="addData()">Enter</button>
            <button id="updateBtn" onclick="updateData()">Update</button>
            <button id="deleteBtn" onclick="deleteData()">Delete</button>
        </div>

        <p id="statusMsg" class="status-msg"></p>

        <div class="list-container">
            <h3>Entered Data List</h3>
            <ul id="dataList"></ul>
        </div>

    </div>

    <script src="B.js"></script>
</body>

</html>
