<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


</head>

<body>
    <div class="container">

        <h1>THE UNIVERSITY OF THE PUNJAB</h1>
        <h2> Registration Form</h2>


        <form>

            <div class="full">
                <label>Student Name</label>
                <input type="text" placeholder="Enter Student Name" required>
            </div>

            <div>
                <label>CNIC / Form-B Number</label>
                <input type="text" placeholder="XXXXX-XXXXXXX-X" required>
            </div>

            <div>
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div>
                <label>Matric Roll Number</label>
                <input type="text" placeholder="Enter Matric Roll Number">
            </div>

            <div>
                <label>Matric Marks</label>
                <input type="number" placeholder="Enter Matric Marks">
            </div>

            <div>
                <label>Intermediate Roll Number</label>
                <input type="text" placeholder="Enter Intermediate Roll Number">
            </div>

            <div>
                <label>Intermediate Marks</label>
                <input type="number" placeholder="Enter Intermediate Marks">
            </div>

            <div>
                <label>College Name</label>
                <input type="text" placeholder="Enter College Name">
            </div>

            <div>
                <label>School Name</label>
                <input type="text" placeholder="Enter School Name">
            </div>

            <div>
                <label>Student Contact Number</label>
                <input type="tel" placeholder="03XXXXXXXXX">
            </div>

            <div>
                <label>Gmail Address</label>
                <input type="email" placeholder="example@gmail.com">
            </div>

            <div class="full">
                <label>Father Name</label>
                <input type="text" placeholder="Enter Father Name">
            </div>

            <div>
                <label>Father CNIC</label>
                <input type="text" placeholder="XXXXX-XXXXXXX-X">
            </div>

            <div>
                <label>Father Contact Number</label>
                <input type="tel" placeholder="03XXXXXXXXX">
            </div>

            <div class="full">
                <button type="submit">LOGIN</button>
            </div>

</body>

</html>
