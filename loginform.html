<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            width: 400px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            margin-top: 12px;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #999;
            border-radius: 5px;
            font-size: 15px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0055aa;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Login Form</h1>

        <form>

            <label>First Name</label>
            <input type="text" placeholder="Enter First Name" required>

            <label>Second Name</label>
            <input type="text" placeholder="Enter Second Name" required>

            <label>Contact Number</label>
            <input type="tel" placeholder="03XXXXXXXXX" required>

            <label>Gmail Address</label>
            <input type="email" placeholder="example@gmail.com" required>

            <button type="submit">Login</button>

        </form>

    </div>

</body>

</html>
