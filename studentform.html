<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form - University of the Punjab</title>

    <style>
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        body {
            background: #f2f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 900px;
            background: #fff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 10px;
        }
        
        h2 {
            text-align: center;
            color: #0f8e51;
            margin-bottom: 30px;
        }
        
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        
        .full {
            grid-column: 1 / 3;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #999;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        
        input:focus {
            border-color: #003366;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            background: #0055aa;
        }
        
        @media(max-width:768px) {
            form {
                grid-template-columns: 1fr;
            }
            .full {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>THE UNIVERSITY OF THE PUNJAB</h1>
        <h2> Registration Form</h2>

        <form>

            <div class="full">
                <label>Student Name</label>
                <input type="text" placeholder="Enter Student Name" required>
            </div>

            <div>
                <label>CNIC / Form-B Number</label>
                <input type="text" placeholder="XXXXX-XXXXXXX-X" required>
            </div>

            <div>
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div>
                <label>Matric Roll Number</label>
                <input type="text" placeholder="Enter Matric Roll Number">
            </div>

            <div>
                <label>Matric Marks</label>
                <input type="number" placeholder="Enter Matric Marks">
            </div>

            <div>
                <label>Intermediate Roll Number</label>
                <input type="text" placeholder="Enter Intermediate Roll Number">
            </div>

            <div>
                <label>Intermediate Marks</label>
                <input type="number" placeholder="Enter Intermediate Marks">
            </div>

            <div>
                <label>College Name</label>
                <input type="text" placeholder="Enter College Name">
            </div>

            <div>
                <label>School Name</label>
                <input type="text" placeholder="Enter School Name">
            </div>

            <div>
                <label>Student Contact Number</label>
                <input type="tel" placeholder="03XXXXXXXXX">
            </div>

            <div>
                <label>Gmail Address</label>
                <input type="email" placeholder="example@gmail.com">
            </div>

            <div class="full">
                <label>Father Name</label>
                <input type="text" placeholder="Enter Father Name">
            </div>

            <div>
                <label>Father CNIC</label>
                <input type="text" placeholder="XXXXX-XXXXXXX-X">
            </div>

            <div>
                <label>Father Contact Number</label>
                <input type="tel" placeholder="03XXXXXXXXX">
            </div>

            <div class="full">
                <button type="submit">LOGIN</button>
            </div>

        </form>

    </div>

</body>

</html>
